<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convites Virtuais Infantis Interativos • Printfoco</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #faf8f5;
      color: #1c1b1a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .hub-card {
      background: #ffffff;
      border: 1px solid #ebe6dc;
      border-radius: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      max-width: 600px;
      width: 100%;
      padding: 36px 28px;
      text-align: center;
    }
    h1 {
      font-size: 26px;
      margin-bottom: 8px;
      color: #1c1b1a;
    }
    p {
      color: #666;
      font-size: 14px;
      margin-bottom: 28px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 500px) {
      .grid { grid-template-columns: 1fr; }
    }
    .theme-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      border-radius: 20px;
      text-decoration: none;
      transition: all 0.25s ease;
      border: 2px solid transparent;
    }
    .theme-link.princesas {
      background: #fff5f7;
      border-color: #f3d7df;
      color: #9e3a58;
    }
    .theme-link.princesas:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 24px rgba(158, 58, 88, 0.15);
      border-color: #d9889f;
    }
    .theme-link.dinossauro {
      background: #f4f8f4;
      border-color: #d6e8d9;
      color: #2d5a3a;
    }
    .theme-link.dinossauro:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 24px rgba(45, 90, 58, 0.15);
      border-color: #528c62;
    }
    .icon {
      font-size: 42px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .sub {
      font-size: 12px;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="hub-card">
    <h1>Convites Interativos Infantis</h1>
    <p>Selecione um dos modelos interativos de 1º aninho desenvolvidos pela Printfoco:</p>

    <div class="grid">
      <a href="princesas/index.html" class="theme-link princesas">
        <span class="icon">👑</span>
        <span class="title">1 Ano Princesas</span>
        <span class="sub">Reino Encantado da Princesa Helena</span>
      </a>

      <a href="dinossauro/index.html" class="theme-link dinossauro">
        <span class="icon">🦕</span>
        <span class="title">1 Ano Dinossauro</span>
        <span class="sub">Dino Park Aventura do Theo</span>
      </a>
    </div>
  </div>
</body>
</html>
